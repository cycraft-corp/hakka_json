name: Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  windows-msvc:
    name: Windows MSVC ${{ matrix.vs-version }} (${{ matrix.build-type }}${{ matrix.sanitizer && ', ASAN' || '' }})
    runs-on: ${{ matrix.os }}
    env:
      ICU_VERSION: "78.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio 2022
          - os: windows-2022
            vs-version: 2022
            build-type: Debug
            sanitizer: false
          - os: windows-2022
            vs-version: 2022
            build-type: Release
            sanitizer: false
          # Address Sanitizer build
          - os: windows-2022
            vs-version: 2022
            build-type: Debug
            sanitizer: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache ICU Build
        uses: actions/cache@v4
        with:
          path: |
            build/icu-install
            build/icu-src
            build/icu-build
          key: icu-${{ env.ICU_VERSION }}-windows-${{ matrix.vs-version }}-${{ matrix.build-type }}-${{ hashFiles('cmake/ICU.cmake') }}
          restore-keys: |
            icu-${{ env.ICU_VERSION }}-windows-${{ matrix.vs-version }}-${{ matrix.build-type }}-
            icu-${{ env.ICU_VERSION }}-windows-${{ matrix.vs-version }}-

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~\AppData\Local\ccache
          key: cmake-windows-${{ matrix.vs-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            cmake-windows-${{ matrix.vs-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
            cmake-windows-${{ matrix.vs-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio ${{ matrix.vs-version == '2022' && '17 2022' }}" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DHAKKA_JSON_BUILD_TESTS=ON `
            ${{ matrix.sanitizer && '-DHAKKA_JSON_ENABLE_SANITIZER_ADDRESS=ON' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        run: |
          cd build
          ctest -C ${{ matrix.build-type }} --output-on-failure --parallel --timeout 300
        env:
          ASAN_OPTIONS: windows_hook_rtl_allocators=true:abort_on_error=1

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.vs-version }}-${{ matrix.build-type }}${{ matrix.sanitizer && '-asan' || '' }}-logs
          path: |
            build/**/*.log
            build/CMakeFiles/*.log
            build/icu_project-prefix/src/icu_project-stamp/*.log
            build/_deps/*-build/*.log
          if-no-files-found: warn
          retention-days: 7

