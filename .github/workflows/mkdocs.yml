name: Documentation & Tools

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/content/**'
      - 'docs/mkdocs.yml'
      - 'docs/pyproject.toml'
      - 'nvl-compare/web/**'
      - '.github/workflows/mkdocs.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/content/**'
      - 'docs/mkdocs.yml'
      - 'nvl-compare/web/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Documentation & NVL-Compare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ─────────────────────────────────────────────────────────
      # NVL-Compare (Vite React App)
      # ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nvl-compare/web/package-lock.json

      - name: Install NVL-Compare Dependencies
        working-directory: nvl-compare/web
        run: npm ci

      - name: Build NVL-Compare
        working-directory: nvl-compare/web
        run: npm run build

      # ─────────────────────────────────────────────────────────
      # MkDocs Documentation
      # ─────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
            docs/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('docs/poetry.lock', 'docs/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Documentation Dependencies
        working-directory: docs
        run: poetry install

      - name: Build MkDocs Site
        working-directory: docs
        run: poetry run mkdocs build --strict

      # ─────────────────────────────────────────────────────────
      # Combine Outputs
      # ─────────────────────────────────────────────────────────
      - name: Copy NVL-Compare to Site
        run: |
          mkdir -p docs/site/nvl-compare
          cp -r nvl-compare/web/dist/* docs/site/nvl-compare/

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
