name: macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  macos-apple-clang:
    name: macOS Apple Clang ${{ matrix.xcode-version }} (${{ matrix.build-type }}${{ matrix.sanitizer && ', ' || '' }}${{ matrix.sanitizer }})
    runs-on: ${{ matrix.os }}
    env:
      ICU_VERSION: "77.1"
    strategy:
      fail-fast: false
      matrix:
        include:

          # macOS 14 (Sonoma) with Xcode 15.4 - ARM64
          - os: macos-14
            xcode-version: "15.4"
            build-type: Debug
            sanitizer: ""
          - os: macos-14
            xcode-version: "15.4"
            build-type: Release
            sanitizer: ""
          - os: macos-14
            xcode-version: "15.4"
            build-type: Debug
            sanitizer: "address"
          - os: macos-14
            xcode-version: "15.4"
            build-type: Debug
            sanitizer: "undefined"

          # macOS 15 (Sequoia) with Xcode 16.2 - ARM64
          - os: macos-15
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: ""
          - os: macos-15
            xcode-version: "16.2"
            build-type: Release
            sanitizer: ""
          - os: macos-15
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: "address"
          - os: macos-15
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: "undefined"

          # macOS 15 (Sequoia) with Xcode 16.2 - Intel (supported until Aug 2027)
          - os: macos-15-intel
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: ""
          - os: macos-15-intel
            xcode-version: "16.2"
            build-type: Release
            sanitizer: ""
          - os: macos-15-intel
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: "address"
          - os: macos-15-intel
            xcode-version: "16.2"
            build-type: Debug
            sanitizer: "undefined"

          # macOS 26 (Tahoe) with Xcode 26.0 - ARM64
          - os: macos-26
            xcode-version: "26.0"
            build-type: Debug
            sanitizer: ""
          - os: macos-26
            xcode-version: "26.0"
            build-type: Release
            sanitizer: ""
          - os: macos-26
            xcode-version: "26.0"
            build-type: Debug
            sanitizer: "address"
          - os: macos-26
            xcode-version: "26.0"
            build-type: Debug
            sanitizer: "undefined"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/ninja
            /usr/local/Cellar/fmt
            /opt/homebrew/Cellar/ninja
            /opt/homebrew/Cellar/fmt
          key: homebrew-${{ runner.os }}-${{ matrix.xcode-version }}-v1
          restore-keys: |
            homebrew-${{ runner.os }}-${{ matrix.xcode-version }}-
            homebrew-${{ runner.os }}-

      - name: Cache ICU Build
        uses: actions/cache@v4
        with:
          path: |
            build/icu-install
            build/_deps/icu-src
            build/_deps/icu-build
          key: icu-${{ env.ICU_VERSION }}-macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-${{ hashFiles('cmake/icu.cmake') }}
          restore-keys: |
            icu-${{ env.ICU_VERSION }}-macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-
            icu-${{ env.ICU_VERSION }}-macos-${{ matrix.xcode-version }}-

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/Library/Caches/ccache
          key: cmake-macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            cmake-macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
            cmake-macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}-

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Install dependencies
        run: |
          # Install ninja and fmt via Homebrew (cmake is pre-installed on GitHub Actions macOS runners)
          # Check and install only if not already present to reduce CI noise
          if ! brew list ninja &>/dev/null; then
            echo "Installing ninja..."
            brew install ninja
          else
            echo "ninja is already installed: $(ninja --version)"
          fi
          
          if ! brew list fmt &>/dev/null; then
            echo "Installing fmt..."
            brew install fmt
          else
            echo "fmt is already installed"
          fi
          
          # Verify cmake and ninja are available
          echo "cmake version: $(cmake --version)"
          echo "ninja version: $(ninja --version)"

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DHAKKA_JSON_BUILD_TESTS=ON \
            -DICU_VERSION=${{ env.ICU_VERSION }} \
            ${{ matrix.sanitizer == 'address' && '-DHAKKA_JSON_ENABLE_SANITIZER_ADDRESS=ON' || '' }} \
            ${{ matrix.sanitizer == 'undefined' && '-DHAKKA_JSON_ENABLE_SANITIZER_UNDEFINED=ON' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --parallel --timeout 300
        env:
          # Sanitizer options for Apple Clang (leak detection disabled on macOS)
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:check_initialization_order=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.xcode-version }}-${{ matrix.build-type }}-${{ matrix.sanitizer || 'none' }}-logs
          path: |
            build/**/*.log
            build/CMakeFiles/*.log
            build/icu_project-prefix/src/icu_project-stamp/*.log
            build/_deps/*-build/*.log
          if-no-files-found: warn
          retention-days: 7

